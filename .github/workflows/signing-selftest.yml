name: Signing Self-Test (tạm thời)

# Workflow chẩn đoán: chỉ chạy với tag "diag-*" nên KHÔNG bao giờ tạo release.
# Dùng để kiểm tra secret + chứng chỉ ký có import được trên runner hay không.
on:
  push:
    tags:
      - 'diag-*'
  workflow_dispatch:

jobs:
  import-only:
    name: Import certificate
    runs-on: macos-14
    steps:
      - name: Import Code Signing Certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.HYPERMAC_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.HYPERMAC_SIGNING_P12_PASSWORD }}
        run: |
          set -uo pipefail
          KC="$RUNNER_TEMP/diag.keychain-db"
          fail() {
            echo "::error title=DIAG::$1"
            exit 1
          }

          [ -n "${SIGNING_P12_BASE64}" ] || fail "Secret BASE64 rỗng/không tồn tại."
          [ -n "${SIGNING_P12_PASSWORD}" ] || fail "Secret PASSWORD rỗng/không tồn tại."
          echo "secrets: base64=${#SIGNING_P12_BASE64} ký tự, password=${#SIGNING_P12_PASSWORD} ký tự"

          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          echo "base64: which=$(command -v base64 || echo none) openssl=$(command -v openssl || echo none) python3=$(command -v python3 || echo none)"
          CLEAN_B64="$(printf '%s' "$SIGNING_P12_BASE64" | tr -d '[:space:]')"
          echo "base64 sạch: ${#CLEAN_B64} ký tự"
          BAD_COUNT="$(printf '%s' "$CLEAN_B64" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')"
          BAD_SAMPLE="$(printf '%s' "$CLEAN_B64" | tr -d 'A-Za-z0-9+/=' | head -c 1 | od -An -tx1 | tr -d ' \n')"
          CASE_HINT="unknown"
          case "$CLEAN_B64" in
            *BEGIN*|*PRIVATE*|*CERTIFICATE*) CASE_HINT="PEM (dán nhầm key.pem/cert.pem)" ;;
            *secret*) CASE_HINT="chuỗi cú pháp GitHub (dán nhầm biểu thức secrets)" ;;
            /*|~*) CASE_HINT="đường dẫn file (cần dán NỘI DUNG file)" ;;
          esac
          echo "::notice title=DIAG-SHAPE::clean=${#CLEAN_B64} invalid=$BAD_COUNT first_invalid_hex=${BAD_SAMPLE:-none} hint=$CASE_HINT"
          if [ "${#CLEAN_B64}" -eq 0 ]; then
            fail "Secret BASE64 chỉ toàn khoảng trắng/xuống dòng (raw ${#SIGNING_P12_BASE64} ký tự, hex: $(printf '%s' "$SIGNING_P12_BASE64" | od -An -tx1 | head -c 60 | tr '\n' ' ')). Hãy dán lại đúng nội dung file .base64."
          fi
          DECODE_ERR="$RUNNER_TEMP/decode.err"
          if ! printf '%s' "$CLEAN_B64" | python3 -c "import base64,sys;raw=''.join(sys.stdin.read().split());sys.stdout.buffer.write(base64.b64decode(raw,validate=True))" > "$RUNNER_TEMP/cert.p12" 2>"$DECODE_ERR"; then
            echo "python decode: $(tail -2 "$DECODE_ERR" | tr '\n' ' ')"
            if ! printf '%s' "$CLEAN_B64" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12" 2>>"$DECODE_ERR"; then
              echo "openssl decode: $(tail -2 "$DECODE_ERR" | tr '\n' ' ')"
              if ! OUT="$(printf '%s' "$CLEAN_B64" | base64 -D > "$RUNNER_TEMP/cert.p12" 2>&1)"; then
                fail "decode lỗi (python/openssl/base64): $(echo "$OUT" | tail -2 | tr '\n' ' ')"
              fi
            fi
          fi
          echo "p12 size: $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes"
          # Nếu nội dung không phải DER (0x30) thì có thể secret bị base64 2 lớp.
          ensure_der() {
            local f="$1" i
            for i in 1 2; do
              [ "$(head -c 1 "$f" | od -An -tx1 | tr -d ' \n')" = "30" ] && return 0
              python3 -c "import base64,sys;p=sys.argv[1];raw=''.join(open(p,'r',errors='ignore').read().split());open(p,'wb').write(base64.b64decode(raw,validate=True))" "$f" 2>/dev/null || return 1
            done
            [ "$(head -c 1 "$f" | od -An -tx1 | tr -d ' \n')" = "30" ]
          }

          echo "::notice title=DIAG-SIZES::raw=${#SIGNING_P12_BASE64} clean=${#CLEAN_B64} p12=$(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') first=$(head -c 1 "$RUNNER_TEMP/cert.p12" | od -An -tx1 | tr -d ' \n')"
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -d' ' -f1) first=$(head -c 1 "$RUNNER_TEMP/cert.p12" | od -An -tx1 | tr -d ' \n')"
          ensure_der "$RUNNER_TEMP/cert.p12" || fail "không phải DER sau 2 lớp decode (size $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -d' ' -f1))"
          if ! OUT="$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -noout -passin "pass:${SIGNING_P12_PASSWORD}" 2>&1)"; then
            echo "$OUT"
            fail "openssl không mở được p12 (size $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' '), sha256 $(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -d' ' -f1)): $(echo "$OUT" | tail -2 | tr '\n' ' ')"
          fi
          echo "openssl: p12 OK"

          if ! OUT="$(security import "$RUNNER_TEMP/cert.p12" -P "$SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" 2>&1)"; then
            echo "$OUT"
            fail "security import: $(echo "$OUT" | tail -3 | tr '\n' ' ')"
          fi
          echo "$OUT"

          if ! OUT="$(security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" 2>&1)"; then
            echo "$OUT"
            fail "partition list: $(echo "$OUT" | tail -3 | tr '\n' ' ')"
          fi

          IDS="$(security find-identity -v -p codesigning "$KC" 2>&1)"
          echo "$IDS"
          case "$IDS" in
            *"HyperMac Self-Signed"*) echo "::notice title=DIAG::Import + identity OK" ;;
            *) fail "Không thấy identity: $(echo "$IDS" | tr '\n' ' ')" ;;
          esac

      - name: Cleanup
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/diag.keychain-db" 2>/dev/null || true
