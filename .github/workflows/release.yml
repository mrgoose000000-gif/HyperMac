name: Build & Release HyperMac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.4.7)'
        required: true
        default: 'v1.4.7'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Build Script Executable
        run: chmod +x build.sh

      # Ký bằng cùng chứng chỉ self-signed với bản local để Designated Requirement
      # (identifier + certificate root) không đổi giữa các phiên bản → TCC giữ quyền.
      # Nếu chưa cấu hình secret, fallback ad-hoc (quyền Accessibility sẽ mất sau update).
      - name: Import Code Signing Certificate
        id: signing
        env:
          SIGNING_P12_BASE64: ${{ secrets.HYPERMAC_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.HYPERMAC_SIGNING_P12_PASSWORD }}
        run: |
          set -uo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/hypermac-signing.keychain-db"

          fail() {
            echo "::error title=Signing certificate import failed::$1"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 1
          }

          if [ -z "${SIGNING_P12_BASE64}" ]; then
            echo "::warning::Chưa có secret HYPERMAC_SIGNING_P12_BASE64 — build sẽ ký ad-hoc."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${SIGNING_P12_PASSWORD}" ]; then
            fail "Thiếu secret HYPERMAC_SIGNING_P12_PASSWORD."
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          if ! security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"; then
            fail "Không tạo được keychain tạm."
          fi
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" \
            || fail "Không unlock được keychain tạm."

          # BSD base64 trên runner macOS chỉ có -D; secret có thể lẫn xuống dòng/CRLF.
          CLEAN_B64="$(printf '%s' "$SIGNING_P12_BASE64" | tr -d '[:space:]')"
          echo "base64 sạch: ${#CLEAN_B64} ký tự"
          if ! printf '%s' "$CLEAN_B64" | base64 -D > "$RUNNER_TEMP/cert.p12" 2>"$RUNNER_TEMP/decode.err"; then
            fail "Secret base64 không giải mã được: $(tail -2 "$RUNNER_TEMP/decode.err" | tr '\n' ' ')"
          fi
          echo "p12 size: $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes"

          if ! P12_INFO="$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -noout -passin "pass:${SIGNING_P12_PASSWORD}" 2>&1)"; then
            fail "Không đọc được p12 bằng mật khẩu đã lưu (sai mật khẩu hoặc file hỏng): $(echo "$P12_INFO" | tail -2 | tr '\n' ' ')"
          fi

          if ! IMPORT_OUT="$(security import "$RUNNER_TEMP/cert.p12" \
                -P "$SIGNING_P12_PASSWORD" \
                -A -t cert -f pkcs12 \
                -k "$KEYCHAIN_PATH" 2>&1)"; then
            fail "security import thất bại: $(echo "$IMPORT_OUT" | tail -3 | tr '\n' ' ')"
          fi
          echo "$IMPORT_OUT"

          if ! PART_OUT="$(security set-key-partition-list \
                -S apple-tool:,apple:,codesign: \
                -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>&1)"; then
            fail "set-key-partition-list thất bại: $(echo "$PART_OUT" | tail -3 | tr '\n' ' ')"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>&1)"
          echo "$IDENTITIES"
          case "$IDENTITIES" in
            *"HyperMac Self-Signed"*)
              echo "✅ Đã import chứng chỉ HyperMac Self-Signed"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              fail "Đã import nhưng không thấy identity 'HyperMac Self-Signed'. Output: $(echo "$IDENTITIES" | tr '\n' ' ')"
              ;;
          esac

      - name: Compile and Package HyperMac Bundle
        run: ./build.sh --no-run
        env:
          CI: true
          HYPERMAC_SIGN_IDENTITY: HyperMac Self-Signed
          HYPERMAC_SIGN_KEYCHAIN: ${{ runner.temp }}/hypermac-signing.keychain-db

      - name: Verify Code Signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --deep --strict build/HyperMac.app
          codesign -dv --verbose=4 build/HyperMac.app 2>&1 | grep -F "Authority=HyperMac Self-Signed"
          codesign -d -r- build/HyperMac.app 2>&1 | tail -1

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: HyperMac ${{ steps.vars.outputs.tag }}
          files: build/HyperMac.zip
          draft: false
          # Tag có hậu tố (v1.6.0-rc1, v1.6.0-test) → release nháp thử nghiệm,
          # không bị UpdateManager coi là bản chính thức.
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}
          generate_release_notes: true

      - name: Cleanup Signing Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hypermac-signing.keychain-db" 2>/dev/null || true
